<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#047857">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIMAK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<title>SIMAK SMAI DUBA</title>
<style>
  :root{--brand:#10b981;--bg:#020617;--bg-elev:#0f172a;--text:#e2e8f0;--text-dim:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 10%,rgba(16,185,129,.12),transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(20,184,166,.10),transparent 60%);pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(148,163,184,.06) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);pointer-events:none;z-index:0}
  #screens{position:fixed;inset:0;z-index:5;overflow:hidden}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:transform 320ms cubic-bezier(.16,1,.3,1),opacity 320ms;will-change:transform,opacity}
  .screen[data-state="active"]{transform:translateX(0);opacity:1;pointer-events:auto}
  .screen[data-state="hidden"]{transform:translateX(0);opacity:0;pointer-events:none}
  .screen[data-state="left"]{transform:translateX(-40%);opacity:0;pointer-events:none}
  .screen[data-state="right"]{transform:translateX(40%);opacity:0;pointer-events:none}
  body.no-anim .screen{transition:none!important}
  .logo-wrap{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(20,184,166,.10));border:1px solid rgba(16,185,129,.35);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px -8px rgba(16,185,129,.4)}
  .logo-wrap svg{width:36px;height:36px;stroke:var(--brand)}
  .title{font-size:22px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#fff,#a7f3d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;text-align:center}
  .subtitle{font-size:13px;color:var(--text-dim);margin-bottom:28px;text-align:center}
  .wrap{width:100%;max-width:380px}
  .btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:16px;color:#fff;margin-bottom:12px;font-family:inherit;font-size:15px;font-weight:700;border:1px solid transparent;cursor:pointer;text-align:left;transition:all 220ms cubic-bezier(.16,1,.3,1)}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px -8px rgba(16,185,129,.6)}
  .btn-secondary{background:rgba(30,41,59,.7);border-color:rgba(71,85,105,.6)}
  .btn-secondary:hover{border-color:rgba(16,185,129,.4);background:rgba(30,41,59,.9)}
  .btn-icon-wrap{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15)}
  .btn-secondary .btn-icon-wrap{background:rgba(16,185,129,.15)}
  .btn-icon-wrap svg{width:22px;height:22px;stroke:#fff}
  .btn-secondary .btn-icon-wrap svg{stroke:var(--brand)}
  .btn-text{flex:1;min-width:0}
  .btn-title{font-size:15px;font-weight:700;margin-bottom:2px}
  .btn-sub{font-size:11px;font-weight:500;opacity:.75}
  .btn-secondary .btn-sub{color:var(--text-dim)}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;margin-bottom:20px;background:transparent;border:0;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border-radius:8px;align-self:flex-start;transition:color 150ms}
  .back-btn:hover{color:#fff}
  .back-btn svg{width:14px;height:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
  .input{width:100%;padding:12px 14px;background:rgba(15,23,42,.6);border:1.5px solid rgba(51,65,85,.8);border-radius:12px;font-size:14px;font-family:inherit;color:#fff;outline:none;transition:border-color 180ms,background 180ms}
  .input:focus{border-color:var(--brand);background:rgba(15,23,42,.9)}
  .input::placeholder{color:rgba(100,116,139,.7)}
  .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:0;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 150ms,opacity 150ms}
  .submit-btn:active{transform:scale(.98)}
  .submit-btn:disabled{opacity:.6;cursor:not-allowed}
  .error-msg{padding:10px 12px;margin-bottom:14px;border-radius:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-size:12px;display:none}
  .error-msg.show{display:block}
  .results-list{max-height:300px;overflow-y:auto;margin-top:16px;display:none;flex-direction:column;gap:8px}
  .results-list.show{display:flex}
  .result-item{padding:12px 14px;background:rgba(15,23,42,.6);border:1px solid rgba(51,65,85,.6);border-radius:12px;cursor:pointer;transition:border-color 150ms,background 150ms;text-align:left;font-family:inherit;color:inherit}
  .result-item:hover{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.05)}
  .result-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px}
  .result-meta{font-size:11px;color:var(--text-dim);font-family:ui-monospace,monospace}
  .selected-card{padding:14px;margin-bottom:20px;background:rgba(16,185,129,.05);border:1px solid rgba(16,185,129,.3);border-radius:12px}
  .selected-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px}
  .selected-detail{font-size:12px;color:var(--text-dim)}
  .dob-row{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin-bottom:6px}
  .dob-label{font-size:10px;text-align:center;color:var(--text-dim);margin-top:4px}
  #loading-overlay{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  #loading-overlay.show{display:flex}
  .spinner{width:42px;height:42px;border:3px solid rgba(16,185,129,.2);border-top-color:var(--brand);border-radius:50%;animation:spin 800ms linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:13px;color:var(--text-dim);font-weight:500}
  #app{position:fixed;inset:0;z-index:10;width:100%;height:100%;border:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 400ms ease;visibility:hidden}
  #app.visible{opacity:1;pointer-events:auto;visibility:visible}
</style>
</head>
<body class="no-anim">

<div id="screens">
  <!-- Chooser -->
  <div class="screen" data-screen="chooser" data-state="active">
    <div class="wrap" style="text-align:center">
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 class="title">SIMAK SMAI DUBA</h1>
      <p class="subtitle">Pilih jenis akses Anda</p>
      <button class="btn btn-primary" onclick="gotoScreen('alumni-search')">
        <div class="btn-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <div class="btn-text"><div class="btn-title">Portal Alumni</div><div class="btn-sub">Untuk siswa lulusan</div></div>
      </button>
      <button class="btn btn-secondary" onclick="gotoScreen('staff')">
        <div class="btn-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div class="btn-text"><div class="btn-title">Login Staff</div><div class="btn-sub">Untuk guru &amp; pegawai</div></div>
      </button>
      <div style="margin-top:32px;font-size:10.5px;color:#64748b;line-height:1.6">
        <strong style="color:#94a3b8">SMA Al-Itsbatiyah Darul Ulum Banyuanyar</strong><br>Sistem Informasi Akademik
      </div>
    </div>
  </div>

  <!-- Staff login -->
  <div class="screen" data-screen="staff" data-state="right">
    <div class="wrap">
      <button class="back-btn" onclick="gotoScreen('chooser')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Kembali</button>
      <h2 style="font-size:22px;font-weight:800;margin-bottom:6px">Login Staff</h2>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:28px">Masuk untuk mengakses dashboard akademik</p>
      <div class="error-msg" id="staff-error"></div>
      <form id="staff-form">
        <div class="field"><label>Username</label><input type="text" class="input" id="staff-user" placeholder="masukkan username" required autocomplete="username" spellcheck="false"></div>
        <div class="field"><label>Kata Sandi</label><input type="password" class="input" id="staff-pass" placeholder="masukkan password" required autocomplete="current-password"></div>
        <button type="submit" class="submit-btn" id="staff-submit">Masuk ke Dashboard</button>
      </form>
    </div>
  </div>

  <!-- Alumni search -->
  <div class="screen" data-screen="alumni-search" data-state="right">
    <div class="wrap">
      <button class="back-btn" onclick="gotoScreen('chooser')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Kembali</button>
      <h2 style="font-size:22px;font-weight:800;margin-bottom:6px">Portal Alumni</h2>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:28px">Cari nama Anda, lalu masuk dengan tanggal lahir</p>
      <div class="error-msg" id="alumni-error"></div>
      <form id="alumni-search-form">
        <div class="field"><label>Nama Siswa atau Nama Ayah</label><input type="text" class="input" id="alumni-keyword" placeholder="Contoh: Ahmad Fauzi" required autocomplete="off" spellcheck="false"></div>
        <button type="submit" class="submit-btn" id="alumni-search-btn">Cari Nama</button>
      </form>
      <div class="results-list" id="alumni-results"></div>
    </div>
  </div>

  <!-- Alumni verify -->
  <div class="screen" data-screen="alumni-verify" data-state="right">
    <div class="wrap">
      <button class="back-btn" onclick="gotoScreen('alumni-search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Pilih nama lain</button>
      <div class="selected-card">
        <div style="font-size:10px;letter-spacing:.08em;color:#34d399;font-weight:700;margin-bottom:6px">DATA ANDA</div>
        <div class="selected-name" id="alumni-selected-name">-</div>
        <div class="selected-detail" id="alumni-selected-detail">-</div>
      </div>
      <div class="error-msg" id="alumni-verify-error"></div>
      <form id="alumni-verify-form">
        <div class="field">
          <label>Tanggal Lahir (bukti bahwa ini adalah Anda)</label>
          <div class="dob-row">
            <input type="text" class="input" id="alumni-tgl" placeholder="20" maxlength="2" inputmode="numeric" required>
            <input type="text" class="input" id="alumni-bln" placeholder="05" maxlength="2" inputmode="numeric" required>
            <input type="text" class="input" id="alumni-thn" placeholder="2000" maxlength="4" inputmode="numeric" required>
          </div>
          <div class="dob-row"><div class="dob-label">Tanggal</div><div class="dob-label">Bulan</div><div class="dob-label">Tahun</div></div>
        </div>
        <button type="submit" class="submit-btn" id="alumni-verify-btn">Masuk</button>
      </form>
    </div>
  </div>
</div>

<div id="loading-overlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Memuat...</div></div>
<iframe id="app" title="SIMAK SMAI DUBA" allow="clipboard-write; fullscreen"></iframe>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var iframe = $('app'), screens = $('screens'), overlay = $('loading-overlay'), overlayText = $('loading-text');
  var iframeMode = '', iframeReady = false, pendingAction = null, alumniSelected = null;
  var SCREEN_ORDER = ['chooser', 'staff', 'alumni-search', 'alumni-verify'];

  if (!window.APP_URL || !/^https:\/\/script\.google\.com\/(macros|a\/)/.test(window.APP_URL)) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#fff">Alamat aplikasi belum diisi di config.js</div>';
    return;
  }
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.remove('no-anim'); }); });

  // ---- Navigasi layar + slide ----
  function gotoScreen(name) {
    var cur = document.querySelector('.screen[data-state="active"]');
    var curName = cur ? cur.dataset.screen : 'chooser';
    if (curName === name) return;
    var forward = SCREEN_ORDER.indexOf(name) > SCREEN_ORDER.indexOf(curName);
    if (name === 'staff') ensureIframe('staff');
    if (name === 'alumni-search') ensureIframe('alumni');
    ['staff-error', 'alumni-error', 'alumni-verify-error'].forEach(function (id) {
      var el = $(id); if (el) el.classList.remove('show');
    });
    document.querySelectorAll('.screen').forEach(function (s) {
      if (s.dataset.screen === name) {
        s.dataset.state = forward ? 'right' : 'left';
        requestAnimationFrame(function () { requestAnimationFrame(function () { s.dataset.state = 'active'; }); });
      } else if (s.dataset.screen === curName) {
        s.dataset.state = forward ? 'left' : 'right';
      } else {
        s.dataset.state = 'hidden';
      }
    });
  }
  window.gotoScreen = gotoScreen;

  // ---- Iframe management ----
  function ensureIframe(mode) {
    if (iframeMode === mode) return;
    iframeMode = mode; iframeReady = false;
    iframe.src = mode === 'staff' ? window.APP_URL + '?staff=1' : window.APP_URL + '?page=alumni';
  }
  iframe.addEventListener('load', function () {
    iframeReady = true;
    if (pendingAction) {
      var act = pendingAction; pendingAction = null;
      setTimeout(function () { doAction(act.type, act.payload); }, 300);
    }
  });

  // ---- Message handler ----
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://script.google.com' && !/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data; if (!d || typeof d !== 'object') return;

    if (d.simak === 'staff-result') {
      if (d.ok) {
        showLoading('Menyiapkan dashboard...');
        var t = setTimeout(showIframe, 4000);
        window._waitReady = function () { clearTimeout(t); showIframe(); };
      } else {
        hideLoading(); showError('staff-error', d.error || 'Login gagal');
        setSubmitState('staff-submit', false);
      }
    }
    if (d.simak === 'main-app-ready' && window._waitReady) {
      window._waitReady(); window._waitReady = null;
    }
    if (d.simak === 'alumni-results') {
      hideLoading();
      if (d.ok && d.data && d.data.status === 'success') renderAlumniResults(d.data);
      else showError('alumni-error', (d.data && d.data.message) || d.error || 'Pencarian gagal');
      setSubmitState('alumni-search-btn', false);
    }
    if (d.simak === 'alumni-result') {
      if (d.ok) {
        showLoading('Menyiapkan portal...');
        var t2 = setTimeout(showIframe, 4000);
        window._waitReady = function () { clearTimeout(t2); showIframe(); };
      } else {
        hideLoading(); showError('alumni-verify-error', d.error || 'Verifikasi gagal');
        setSubmitState('alumni-verify-btn', false);
      }
    }
  });

  function doAction(type, payload) {
    if (!iframeReady) { pendingAction = { type: type, payload: payload }; return; }
    try { iframe.contentWindow.postMessage({ simak: type, ...payload }, '*'); }
    catch (err) {
      hideLoading();
      showError(type.indexOf('staff') !== -1 ? 'staff-error' : 'alumni-verify-error', 'Koneksi bermasalah');
      setSubmitState(type.indexOf('staff') !== -1 ? 'staff-submit' : 'alumni-verify-btn', false);
    }
  }
  function showLoading(text) { overlayText.textContent = text || 'Memuat...'; overlay.classList.add('show'); }
  function hideLoading() { overlay.classList.remove('show'); }
  function showIframe() { hideLoading(); iframe.classList.add('visible'); }
  function showError(id, msg) { var el = $(id); if (el) { el.textContent = msg; el.classList.add('show'); } }
  function setSubmitState(id, loading) {
    var btn = $(id); if (!btn) return;
    btn.disabled = loading;
    if (loading) { btn.dataset.orig = btn.innerHTML; btn.innerHTML = '<span style="opacity:.8">Memproses...</span>'; }
    else if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
  }

  // ---- Staff form ----
  $('staff-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('staff-user').value.trim(), p = $('staff-pass').value;
    if (!u || !p) { showError('staff-error', 'Isi username dan password'); return; }
    $('staff-error').classList.remove('show');
    setSubmitState('staff-submit', true);
    showLoading('Memverifikasi akun...');
    doAction('do-staff-login', { username: u, password: p });
  });

  // ---- Alumni search ----
  $('alumni-search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var kw = $('alumni-keyword').value.trim();
    if (kw.length < 3) { showError('alumni-error', 'Ketik minimal 3 huruf'); return; }
    $('alumni-error').classList.remove('show');
    setSubmitState('alumni-search-btn', true);
    showLoading('Mencari...');
    doAction('do-alumni-search', { keyword: kw });
  });
  function renderAlumniResults(res) {
    var list = $('alumni-results'), items = res.data || [];
    if (!items.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px">Tidak ditemukan.</div>'; list.classList.add('show'); return; }
    list.innerHTML = items.map(function (item, idx) {
      return '<button type="button" class="result-item" onclick="pickAlumni(' + idx + ')"><div class="result-name">' + (item.nama || '-') + '</div><div class="result-meta">' + (item.noInduk || '') + (item.angkatan ? ' • Angkatan ' + item.angkatan : '') + '</div></button>';
    }).join('');
    list.classList.add('show');
    window._alumniItems = items;
  }
  window.pickAlumni = function (idx) {
    var item = (window._alumniItems || [])[idx]; if (!item) return;
    alumniSelected = item;
    $('alumni-selected-name').textContent = item.nama;
    $('alumni-selected-detail').textContent = item.noInduk + (item.angkatan ? ' • Angkatan ' + item.angkatan : '');
    ['alumni-tgl', 'alumni-bln', 'alumni-thn'].forEach(function (id) { $(id).value = ''; });
    gotoScreen('alumni-verify');
    setTimeout(function () { $('alumni-tgl').focus(); }, 350);
  };

  // ---- Alumni verify ----
  $('alumni-verify-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!alumniSelected) return;
    var d = $('alumni-tgl').value.trim(), m = $('alumni-bln').value.trim(), y = $('alumni-thn').value.trim();
    if (!/^\d{1,2}$/.test(d) || !/^\d{1,2}$/.test(m) || !/^\d{4}$/.test(y) || +d < 1 || +d > 31 || +m < 1 || +m > 12) {
      showError('alumni-verify-error', 'Isi tanggal lahir dengan benar. Contoh: 20 05 2000'); return;
    }
    $('alumni-verify-error').classList.remove('show');
    setSubmitState('alumni-verify-btn', true);
    showLoading('Memverifikasi...');
    doAction('do-alumni-login', { noInduk: alumniSelected.noInduk, tglLahir: d + ' ' + m + ' ' + y });
  });
  [['alumni-tgl', 'alumni-bln'], ['alumni-bln', 'alumni-thn']].forEach(function (pair) {
    $(pair[0]).addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
      if (this.value.length === 2) $(pair[1]).focus();
    });
  });
  $('alumni-thn').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });

  // ---- Deep-link ----
  var target = new URLSearchParams(location.search).get('target');
  if (target === 'staff') gotoScreen('staff');
  else if (target === 'alumni') gotoScreen('alumni-search');
})();
</script>
</body>
</html>
